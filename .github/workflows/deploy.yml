name: Verify portfolio and controlled Pages release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish only after separate launch approval and Pages configuration
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Set up Python with SQLite
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up exact base R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Select and verify required runtimes
        shell: bash
        run: |
          echo "RSCRIPT_PATH=$(command -v Rscript)" >> "$GITHUB_ENV"
          Rscript --vanilla -e 'stopifnot(as.character(getRversion()) == "4.6.1"); cat(R.version.string, "\n")'
          python -c "import sqlite3, sys; print(sys.version); print(sqlite3.sqlite_version)"
          node --version
      - name: Use the required npm version
        run: npm install --global npm@11.12.1
      - name: Install the locked dependency graph
        run: npm ci
      - name: Provision the configured browser
        run: npx --no-install playwright install --with-deps msedge
      - name: Record browser and npm versions
        run: |
          microsoft-edge --version
          npm --version
      - name: Check formatting
        run: npm run format:check
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build production output
        run: npm run build
      - name: Validate repository and generated output
        run: npm run validate
      - name: Verify content, runtime parity and safety controls
        run: npm run test:content
      - name: Verify browser behavior and accessibility
        run: npm test
      - name: Upload only the verified Pages output
        if: github.repository == 'A-C-A-F/a-c-a-f.github.io' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.repository == 'A-C-A-F/a-c-a-f.github.io' && github.ref == 'refs/heads/main' && vars.PAGES_DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the separately approved Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
